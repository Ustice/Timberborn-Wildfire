name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hosted-checks:
    name: Hosted checks
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile

      - name: Check TypeScript
        run: bun run typecheck

      - name: Check generated blueprints
        run: bun run blueprints:check

      - name: Test TypeScript utilities
        run: bun run test:scripts

      - name: Test portable .NET projects
        run: bun run test:portable

      # Portable tests compile and discover the shader suite, but report it as
      # skipped without opt-in. Native adapter tests require Timberborn managed
      # DLLs; actual shader execution requires licensed Unity and compute support.
      # Packaging and live-game validation run in their provisioned environments.
      - name: Check hosted-safe deploy plan
        run: >
          bun scripts/deploy-timberborn-mod.ts
          --plan-only
          --configuration Release
          --mods-dir "$RUNNER_TEMP/wildfire-mods"
